name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run semantic-release
        id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get new version
        if: steps.release.outputs.new_release_published == 'true' || success()
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  update-tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success'

    steps:
      - name: Wait for release tarball
        run: sleep 30

      - name: Get version from release
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/henchoznoe/GitSetup/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download tarball and compute SHA256
        id: sha
        run: |
          URL="https://github.com/henchoznoe/GitSetup/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d ' ' -f 1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v6.0.3
        with:
          repository: henchoznoe/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          mkdir -p Formula
          cat > Formula/git-setup.rb << EOF
          class GitSetup < Formula
            desc "Automated & non-destructive Git, SSH, and GPG environment setup for macOS"
            homepage "https://github.com/henchoznoe/GitSetup"
            url "https://github.com/henchoznoe/GitSetup/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "node@22"
            depends_on "pnpm" => :build
            depends_on :macos

            def install
              system "pnpm", "install", "--frozen-lockfile"
              system "pnpm", "build"
              bin.install "dist/git-setup.js" => "git-setup"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/git-setup --version")
            end
          end
          EOF
          sed -i 's/^          //' Formula/git-setup.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-setup.rb
          git commit -m "feat: update git-setup to v${{ steps.version.outputs.version }}"
          git push
